# Cross-platform end-to-end coverage of the JUST-BUILT (from-source) bugsee-cli
# on every push/PR. Builds the debug binary on ubuntu, macOS, and Windows on
# both x64 and arm64, and drives it through every upload flow via the stdlib
# mock-server harness (scripts/e2e_flows.py) — real HTTP round-trips, not
# dry-run.
#
# Complementary to windows-e2e.yml: that workflow is manual (workflow_dispatch)
# and tests the PUBLISHED release binary from download.bugsee.com; this one tests
# the current commit's source build on four runners pre-merge. Different trigger,
# different binary provenance — intentionally not merged.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: target/debug/bugsee-cli
            py: python3
          - os: macos-latest
            bin: target/debug/bugsee-cli
            py: python3
          - os: windows-latest
            bin: target/debug/bugsee-cli.exe
            py: python
          # Windows on ARM. Kept at parity with the x64 leg rather than left to
          # the build-only check in ci.yml: what differs across platforms is
          # path handling, process spawning and file I/O, which this harness
          # exercises and a compile does not. The image is a different Windows
          # 11 image from windows-latest, so git-bash and `python` being on PATH
          # is an assumption this job is here to test.
          - os: windows-11-arm
            bin: target/debug/bugsee-cli.exe
            py: python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI (debug)
        run: cargo build --bin bugsee-cli
      - name: Run the e2e flow matrix (real mock-server uploads)
        # git-bash is preinstalled on both Windows images, so one bash step
        # with forward-slash paths works identically on every runner.
        shell: bash
        run: |
          ${{ matrix.py }} --version
          ${{ matrix.py }} scripts/e2e_flows.py --bin "${{ matrix.bin }}"
