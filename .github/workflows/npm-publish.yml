name: Publish to npm

# OIDC-based npm publish (Trusted Publishing). This workflow is the
# trust target on every published package's npmjs.com settings —
# `workflow_filename = npm-publish.yml` in npm's Trusted Publisher UI.
#
# It publishes SEVEN packages in the one `publish-optional-deps` job:
# @bugsee/cli + the six @bugsee/cli-<platform> packages — the binary split per
# os/cpu behind optionalDependencies, assembled by npm/build.mjs from the
# release's binary archives. See npm/README.md.
#
# The legacy single-package `@bugsee/bugsee-cli` (the cargo-dist npm installer)
# is NOT published from here any more: its launcher exited 0 when the binary was
# killed by a signal (#87). It was frozen at 0.8.2 (the one patched release) and
# deprecated in favour of @bugsee/cli. Do not re-add a job for it.
#
# EVERY ONE of those seven names needs its OWN Trusted Publisher entry on
# npmjs.com (repository bugsee/bugsee-cli, workflow npm-publish.yml) before its
# FIRST publish. That entry lives on a PACKAGE's settings page, so it cannot
# even be created for a name that has never been published: each new name needs
# one manual publish first, after which `npm trust github ... --allow-publish`
# attaches the entry. Nothing here can detect it is missing — a package without one fails at `npm publish`
# with a 404 on the PUT that reads as though the package does not exist rather
# than as a missing trust configuration.
#
# >>> RUNBOOK: `bash npm/bootstrap-names.sh <name>` does both steps and is
# >>> idempotent; npm/README.md, "First-publish bootstrap" explains it. Read it before the
# >>> first release that includes a new package name.
#
# Why a separate workflow (and not folded into release.yml):
# `dist init` regenerates release.yml on every dist upgrade and would
# silently clobber any OIDC wiring there. Keeping the npm publish in
# our own workflow file insulates it from dist's lifecycle. dist still
# builds the per-platform binary archives and attaches them to the GitHub
# Release; we just download those and publish ourselves.
#
# Triggers:
#   - `workflow_run` on the dist `Release` workflow completing — the
#     AUTOMATED path, so every tag-push release publishes to npm without
#     a manual step. We use `workflow_run` (NOT `release: published`)
#     because dist's Release workflow creates the release with the
#     default GITHUB_TOKEN, and GitHub deliberately suppresses
#     `release`/`push` workflow chains triggered that way — whereas
#     `workflow_run` (another workflow completing) is NOT suppressed, so
#     it fires reliably. Guarded to a SUCCESSFUL, tag-`push`-triggered
#     Release whose tag looks like `vX.Y.Z` (PR-mode Release runs and
#     failed releases are skipped). By the time Release has completed,
#     the binary archives are already attached to the release.
#   - `workflow_dispatch` with a `tag` input — the MANUAL path, for
#     backfilling missing versions or re-publishing a specific release.
#
# Both paths converge on the `resolve` step, which normalizes the tag
# and gates publication on a version-tag match.
#
# Hard requirements for npm Trusted Publishing (per npm docs):
#   - `permissions: id-token: write` to mint the OIDC token
#   - Node ≥ 22.14.0 and npm ≥ 11.5.1
#   - No `NODE_AUTH_TOKEN` env var anywhere — even an empty value makes
#     npm prefer (broken) token auth over OIDC
#   - `package.json#repository` matches the GitHub URL exactly
#     (dist generates this from Cargo.toml — already correct)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.2)'
        required: true
        type: string
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  # workflow_dispatch → inputs.tag; workflow_run → the Release run's tag
  # (head_branch is the tag name for a tag-push-triggered run).
  group: npm-publish-${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish-optional-deps:
    name: publish @bugsee/cli family via OIDC
    runs-on: ubuntu-latest
    # Manual dispatch always runs. The automated path runs only for a
    # SUCCESSFUL Release that was triggered by a tag PUSH whose ref looks
    # like a version tag — this filters out PR-mode Release runs (which
    # complete with event == 'pull_request') and failed releases. The
    # exact `vX.Y.Z` shape is re-checked in `resolve`
    # (`startsWith(..., 'v')` alone would also match e.g. `vnext`).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          # Via env, never interpolated into the script: head_branch and the
          # dispatch input are untrusted strings (defence in depth), and `${{ }}` is
          # substituted BEFORE the shell parses the script (code injection).
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$HEAD_BRANCH"
          fi
          # A newline would let the value smuggle extra `key=value` lines into
          # $GITHUB_OUTPUT (e.g. should_publish=true) — refuse before writing it.
          case "$tag" in *$'\n'*|*$'\r'*) echo "::error::tag contains a newline"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # ANCHORED. Unanchored, `^v[0-9]+\.[0-9]+\.[0-9]+` also matches
          # `v1.2.3-rc1`, which would then publish as 1.2.3-rc1 with no `--tag`
          # and MOVE `dist-tags.latest` onto a prerelease. That would hit all
          # seven packages at once, so prereleases are matched explicitly and
          # routed to `next` rather than silently treated as stable.
          if echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            {
              echo "should_publish=true"
              echo "version=${tag#v}"
              echo "dist_tag=latest"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved release tag: $tag (stable -> dist-tag 'latest')"
          elif echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
            {
              echo "should_publish=true"
              echo "version=${tag#v}"
              echo "dist_tag=next"
            } >> "$GITHUB_OUTPUT"
            echo "Resolved release tag: $tag (prerelease -> dist-tag 'next')"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::'$tag' is not a version tag (vX.Y.Z[-prerelease]); skipping npm publish."
          fi

      - name: Checkout the release tag
        # AT THE TAG, not at the default branch. A `workflow_run` run checks
        # out `main` by default, and `npm/build.mjs` cross-checks the version
        # it stamps against `Cargo.toml` — so a `main` that has already moved
        # on would abort the build rather than publish packages whose sources
        # are not the ones the release was cut from.
        #
        # On the automated path, pin to the COMMIT the Release run built
        # (`workflow_run.head_sha`), not the tag name: a tag can be force-pushed
        # between the Release finishing and this job starting, and this job
        # runs repo code (`npm/build.mjs`) with OIDC publish rights. A manual
        # dispatch has no workflow_run, so it falls back to the typed tag.
        if: steps.resolve.outputs.should_publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Node
        # DELIBERATELY no `registry-url:` — setup-node with that option writes
        # an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`, which makes npm prefer
        # token auth over the OIDC token, and every publish below would fail.
        if: steps.resolve.outputs.should_publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Upgrade npm to satisfy Trusted Publishing floor (≥ 11.5.1)
        if: steps.resolve.outputs.should_publish == 'true'
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: Download platform binaries from the release
        # The archives AND their `.sha256` sidecars: build.mjs refuses to
        # package a binary it cannot verify, so omitting the sidecars would
        # fail the build rather than silently ship an unchecked binary.
        if: steps.resolve.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'bugsee-cli-*-*.tar.xz' \
            --pattern 'bugsee-cli-*-*.tar.xz.sha256' \
            --pattern 'bugsee-cli-*-*.zip' \
            --pattern 'bugsee-cli-*-*.zip.sha256'
          ls -la release-assets/

      - name: Assemble the seven packages
        # No `--allow-missing`: if a target's asset is absent (a build leg
        # failed, or `targets` changed without `dist generate`), this must
        # fail here rather than publish a family whose front package pins an
        # optionalDependency that will never exist.
        if: steps.resolve.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          node npm/build.mjs \
            --artifacts-dir release-assets \
            --version "$VERSION" \
            --out npm/dist
          find npm/dist -maxdepth 2 -name package.json -exec sh -c \
            'echo "--- $1"; cat "$1"' _ {} \;

      - name: Publish via OIDC
        # ORDER IS LOAD-BEARING: the six platform packages first, the front
        # package last. npm skips an unresolvable optional dependency
        # SILENTLY, so publishing @bugsee/cli first opens a window in which
        # `npm install @bugsee/cli` succeeds with no binary at all and only
        # fails later, at run time, with a confusing error.
        #
        # THE LOOP MUST BE RESUMABLE. An npm version is immutable: once
        # @bugsee/cli-linux-x64@X.Y.Z exists it can never be republished. So a
        # failure partway through (a missing trusted publisher on package 4 of
        # 6 is the likely cause — see the bootstrap runbook in npm/README.md)
        # would otherwise leave 1-3 on the registry and wedge the version
        # permanently: a re-run would die at package 1 with EPUBLISHCONFLICT
        # and the remaining four could never be published at all. `publish_one`
        # therefore treats "this exact name@version is already on the registry"
        # as success, both BEFORE publishing (the resume path) and AFTER a
        # failed publish (a lost response, or a race). Fix the underlying
        # cause, re-run the workflow, and it picks up where it stopped.
        #
        # Each `npm publish` mints its own OIDC token; trust on npmjs.com maps
        # (repo, workflow filename) -> package, so EVERY ONE of the seven
        # packages needs a Trusted Publisher configured for `npm-publish.yml`,
        # AND must already exist on the registry for that setting to be
        # reachable. Read npm/README.md#first-publish-bootstrap before the
        # first release. For the rest of the OIDC requirements see the header
        # comment — in particular, do NOT add `env: NODE_AUTH_TOKEN`.
        #
        # `--provenance` requires a public repo (bugsee/bugsee-cli is public)
        # and a `repository` field matching the GitHub URL — build.mjs writes
        # the same string dist does.
        if: steps.resolve.outputs.should_publish == 'true'
        env:
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
        run: |
          set -euo pipefail

          already_published() {
            # `npm view` exits non-zero with E404 both for an unknown package
            # and for a known package without that version, which is exactly
            # the distinction we want. Read-only and unauthenticated.
            npm view "$1@$2" version >/dev/null 2>&1
          }

          publish_one() {
            dir="$1"
            name="$(node -p "require('$GITHUB_WORKSPACE/$dir/package.json').name")"
            version="$(node -p "require('$GITHUB_WORKSPACE/$dir/package.json').version")"

            if already_published "$name" "$version"; then
              echo "::notice::$name@$version is already on the registry — skipping"
              return 0
            fi

            if npm publish "$GITHUB_WORKSPACE/$dir" \
                 --access public --provenance --tag "$DIST_TAG"; then
              return 0
            fi

            # The publish reported failure. If the version is nonetheless on
            # the registry, the write landed and only the response was lost
            # (or a concurrent run won the race) — either way there is nothing
            # left to do for this package and failing here would only wedge
            # the ones after it.
            if already_published "$name" "$version"; then
              echo "::notice::$name@$version reached the registry despite the error — continuing"
              return 0
            fi

            echo "::error::failed to publish $name@$version"
            return 1
          }

          for dir in npm/dist/bugsee-cli-*; do
            echo "::group::publish $dir"
            publish_one "$dir"
            echo "::endgroup::"
          done

          echo "::group::publish npm/dist/cli"
          publish_one "npm/dist/cli"
          echo "::endgroup::"
