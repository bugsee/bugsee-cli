# Dependabot keeps bugsee-cli's Rust crates and GitHub Actions current.
# Version updates are batched weekly (minor/patch grouped into one PR each) to
# limit noise; Dependabot security updates land out-of-band as soon as an
# advisory is published (enable "Dependabot security updates" in repo settings).
version: 2
updates:
  # Rust crate dependencies (Cargo.toml / Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # One PR per week for all non-major bumps; majors come individually so
      # they get explicit review.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # `symbolic-common` / `symbolic-debuginfo` MUST stay on major 13 to remain
      # identifier-compatible with the worker's `symbolic`: the ELF `code_id` and
      # Mach-O `debug_id` the CLI extracts are stable across major-13 minors, but
      # a major bump (14.x) could diverge from what the worker reads and silently
      # break symbolication. Minor/patch within 13.x are still proposed (the
      # arch/format identifier-pinning tests guard those); a major is not.
      - dependency-name: "symbolic-common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "symbolic-debuginfo"
        update-types: ["version-update:semver-major"]

  # GitHub Actions pinned in the CI / release / npm-publish / mirror workflows.
  #
  # REVIEWER TRAP: `.github/workflows/release.yml` is GENERATED by cargo-dist and
  # is verified against the generator by the `plan` job. Dependabot cannot be
  # told to skip a single file, so it will keep proposing action bumps inside
  # that file — and `plan` will keep failing them. Do NOT merge such a PR: `plan`
  # is also the FIRST job of the real release workflow, so a mismatched
  # release.yml breaks the next `vX.Y.Z` tag push, not just the PR. Drop the
  # release.yml hunks and keep the rest; the file only changes when
  # `cargo-dist-version` is bumped and `dist generate` is re-run.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
