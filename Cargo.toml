[package]
name = "bugsee-cli"
version = "0.7.4"
edition = "2021"
rust-version = "1.79"
authors = ["Bugsee"]
description = "Bugsee CLI — cross-platform symbol collection, conversion, and upload."
readme = "README.md"
repository = "https://github.com/bugsee/bugsee-cli"
homepage = "https://github.com/bugsee/bugsee-cli"
publish = false

[[bin]]
name = "bugsee-cli"
path = "src/main.rs"

# Opt this package in to dist releases despite `publish = false`. Without
# this, `dist init` reports the workspace as having "nothing to Release".
[package.metadata.dist]
dist = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "bugsee/homebrew-tap"
# A namespace to use when publishing this package to the npm registry
npm-scope = "@bugsee"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "cargo", "env"] }

# Async runtime + HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "gzip"] }
futures-util = "0.3"

# Symbol parsing — the `symbolic` Rust crate family, aligned with the worker's
# `symbolic` Python wheels so both sides parse the same artifacts. Drifting
# majors across producer/consumer would risk subtle DWARF/ELF/PE divergence.
# Worker is on 13 (target 13.1.1); float within the same major. The ELF
# `code_id` (GNU build-id) the per-`.so` native upload reads is a stable,
# major-13 value, so a newer minor here stays identifier-compatible with the
# worker's 13.1.1.
symbolic-common = "13.9.0"
symbolic-debuginfo = "13.9.0"

# Regex for the iOS deps text parsers (Cartfile.resolved lines and otool -L
# load-path lines). Used in cli/ios_deps.rs only.
regex = "1"

# Apple plist reader — used by `bugsee-cli build-env read-plist` so the
# Python BugseeAgents can shell to a single canonical Info.plist reader
# instead of each having its own `plistlib.load` / `PlistBuddy` shim.
# `1.x` lineage is stable; same major the worker's `symbolic` family
# pulls in transitively, so cargo dedup keeps this free.
plist = "1"
# Format-specific crates pulled in per-module as implementation lands:
# symbolic-proguard = "13"
# symbolic-sourcemapcache = "13"
# symbolic-il2cpp = "13"  # experimental, for the Unity gap

# Compression — zstd is the wire format (level 9–11 typical); zip writes archives with Z_STANDARD entries
zstd = { version = "0.13", features = ["zstdmt"] }
zip = { version = "7", default-features = false, features = ["zstd", "deflate"] }

# gzip — `.xcactivitylog` build logs are gzip of an SLF0 token stream. Already
# in the dependency tree via `zip`/`reqwest`, so this direct dep adds no new
# crate. Used in cli/xcactivitylog.rs only.
flate2 = "1"

# Serialization + IDs
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v3", "v4", "v5", "serde"] }

# Hashing (sha1 for content fingerprints + chunk identity; sha2 for stronger hashes;
# md-5 matches Java `UUID.nameUUIDFromBytes` for legacy mapping-derived BUILD_UUIDs.)
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.11"
hex = "0.4"

# File discovery
walkdir = "2"
globset = "0.4"

# Errors + diagnostics
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.17"
tempfile = "3"

# In-place self-replacement of the running executable for `bugsee-cli update`.
# Handles the Windows "can't overwrite a running .exe" dance (rename-then-stage)
# and the Unix atomic-rename uniformly. Cross-platform, so it stays in the plain
# [dependencies] table (NOT a cfg(target) table).
self-replace = "1"

# Unix double-fork for `xcode post-action`'s background (daemon) mode. This is a
# TARGET-specific table, so it MUST come AFTER the main [dependencies] table —
# placed mid-table, TOML would capture every following key into the unix-only
# table and those crates would vanish on Windows. Already in the tree via
# tokio/reqwest, so no new crate. Used in src/daemon.rs only (no-op stub on
# non-unix).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# In-process HTTP mock for the upload subcommands' integration + unit tests.
# Lets us pin the registration POST body and the presigned PUT contract
# (entry names, zstd method, request flags) without a live appserver.
wiremock = "0.6"
